<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
  <title id="title">Red polypropylene mesh bag</title>
  <desc id="desc">Stylized red woven mesh produce bag with a drawstring</desc>
